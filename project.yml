name: MentalConcierge
options:
  bundleIdPrefix: com.furkancengiz
targets:
  MentalConcierge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: ios-app/MentalConciergeApp.swift
      - path: ios-app/Info.plist
        buildPhase: none
      - path: ios-app/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ios-app/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancengiz.mentalconcierge.bodrum
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: 1,2
        SWIFT_VERSION: "5.9"
