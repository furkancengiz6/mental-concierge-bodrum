name: MentalConcierge
options:
  bundleIdPrefix: com.furkancengiz
targets:
  MentalConcierge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: 
      - path: ios-app
        excludes:
          - Info.plist
    info:
      path: ios-app/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.furkancengiz.mentalconcierge.bodrum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
