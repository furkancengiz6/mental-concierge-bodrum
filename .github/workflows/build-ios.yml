name: Build iOS for Appetize
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild -project MentalConcierge.xcodeproj \
            -scheme MentalConcierge \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            ENABLE_PREVIEWS=NO

      - name: Inspect App Bundle
        run: |
          echo "=== App Bundle Contents ==="
          ls -la build/Build/Products/Release-iphonesimulator/MentalConcierge.app/
          echo ""
          echo "=== Binary Architecture ==="
          file build/Build/Products/Release-iphonesimulator/MentalConcierge.app/MentalConcierge
          echo ""
          echo "=== Binary Details ==="
          lipo -info build/Build/Products/Release-iphonesimulator/MentalConcierge.app/MentalConcierge || true
          echo ""
          echo "=== Info.plist ==="
          plutil -p build/Build/Products/Release-iphonesimulator/MentalConcierge.app/Info.plist

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MentalConcierge.zip
          path: build/Build/Products/Release-iphonesimulator/MentalConcierge.app
