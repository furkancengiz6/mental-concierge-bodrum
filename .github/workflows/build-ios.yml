name: Build iOS for Appetize
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build for Simulator
        run: |
          xcodebuild -project MentalConcierge.xcodeproj \
            -scheme MentalConcierge \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            SWIFT_SERIALIZE_DEBUGGING_OPTIONS=NO

      - name: Zip App Bundle
        run: |
          cd build/Build/Products/Release-iphonesimulator
          zip -r MentalConcierge.zip MentalConcierge.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sim-build
          path: build/Build/Products/Release-iphonesimulator/MentalConcierge.zip
